<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد مدیریت</title>
    <meta name="theme-color" content="#0891b2">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      /* A beautiful and modern Persian font */
      @import url('https://cdn.font-face.ir/css/sahel.css');
      body {
        font-family: 'Sahel', sans-serif;
        background-color: #f8fafc; /* bg-gray-50 */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; /* slate-100 */
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; /* slate-400 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* slate-500 */
      }
      /* Fix for modal animation */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes scale-up {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .animate-scale-up {
        animation: scale-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Utility for hiding scrollbar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      /* New loader styles */
      .loader {
        width: 48px;
        height: 48px;
        border: 5px dotted #FFF;
        border-radius: 50%;
        display: inline-block;
        position: relative;
        box-sizing: border-box;
        animation: rotation 2s linear infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      } 
      
      /* New skeleton loader styles */
      .skeleton-line-loader {
          width: 100%;
          height: 4px; /* A thin line */
          background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
          background-size: 200% 100%;
          animation: skeleton-shine 1.5s linear infinite;
          border-radius: 2px;
      }

      @keyframes skeleton-shine {
          0% {
              background-position: 200% 0;
          }
          100% {
              background-position: -200% 0;
          }
      }
    </style>
